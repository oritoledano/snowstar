<!DOCTYPE html>
<html lang="en" data-product="mutra">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Snowstar — Dashboard</title>
<link rel="icon" href="assets/ssc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="js/mutra-skin.js?v=4"></script>
<link rel="stylesheet" href="css/skins.css?v=10">
<link rel="stylesheet" href="css/account.css?v=8">
<link rel="stylesheet" href="css/mutra.css?v=62">
<style>
  body{padding-bottom:60px}
  .db-wrap{max-width:1180px;margin:0 auto;padding:96px clamp(16px,4vw,44px) 40px}
  .db-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
  .db-head h1{font-family:"Anton",var(--font-display),sans-serif;font-weight:400;text-transform:uppercase;
    font-size:clamp(1.7rem,3.4vw,2.4rem)}
  .db-tabs{display:flex;gap:8px;flex-wrap:wrap}
  .db-tab{font-family:var(--font-display);font-size:.76rem;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);cursor:pointer;padding:9px 16px;border-radius:99px;
    border:1px solid var(--line);background:none;transition:.2s}
  .db-tab:hover{color:var(--text)}
  .db-tab.active{color:var(--on-accent,#04121d);background:var(--grad);border-color:transparent}
  .db-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 26px}
  .db-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;cursor:pointer;transition:border-color .2s}
  .db-card:hover{border-color:var(--line-2,var(--line))}
  .db-card b{font-family:var(--font-display);font-size:1.9rem;display:block;line-height:1}
  .db-card span{color:var(--muted);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;margin-top:6px;display:block}
  .db-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
  .db-panel h2{font-size:1.02rem;margin-bottom:14px}
  .db-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:900px){.db-grid{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:.87rem}
  th{text-align:left;color:var(--dim,var(--muted));font-weight:500;font-size:.7rem;letter-spacing:.12em;
     text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);color:var(--text)}
  td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--tint,rgba(128,128,128,.06))}
  .bar{height:6px;border-radius:3px;background:var(--grad);display:block;min-width:2px}
  .db-empty{color:var(--dim,var(--muted));padding:16px 4px;font-size:.9rem}
  .db-gate{max-width:420px;margin:120px auto;text-align:center}
  .pill{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;
        border:1px solid var(--line-2,var(--line));color:var(--amber,#8fd8ff)}
  .jrn{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .jrn li{list-style:none;color:var(--muted);font-size:.84rem;padding:3px 0}
  .jrn b{color:var(--text);font-weight:600}
  .chip{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;
    padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:none}
  .chip.active{color:var(--on-accent,#04121d);background:var(--grad);border-color:transparent}
  /* submissions + mail (ported from review.html) */
  .rv-item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
  .rv-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .rv-top b{font-size:1.02rem}
  .rv-top .who{color:var(--amber,#8fd8ff);font-size:.86rem}
  .rv-top .meta{color:var(--muted);font-size:.78rem;margin-left:auto}
  .rv-note{color:var(--muted);font-size:.84rem;margin:6px 0 10px}
  .rv-item audio{width:100%;margin:8px 0 12px}
  .rv-acts{display:flex;gap:8px;flex-wrap:wrap}
  .rv-btn{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
    padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text)}
  .rv-ok{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4)}
  .rv-no{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.35)}
  .rv-decl{background:var(--panel-2,rgba(128,128,128,.08));border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.8rem;color:var(--muted)}
  .rv-decl b{color:var(--text)}
  .rv-acum{color:#eab308;font-weight:600}
  .rv-mrow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:.86rem}
  .rv-mrow summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}
  .rv-mrow pre{white-space:pre-wrap;color:var(--muted);font:inherit;font-size:.8rem;margin:10px 0;border-top:1px solid var(--line);padding-top:10px}
  .rv-sent{color:#34d399;font-size:.74rem}
  .rv-err{color:#f87171;font-size:.74rem}
  .rv-mut{color:#94a3b8;font-size:.74rem}
  /* member drawer — a sheet rather than a modal, so the table stays visible
     behind it and you can tell which row you opened */
  .mem-open{background:none;border:0;color:var(--ice,#8fd8ff);font:inherit;cursor:pointer;padding:0;text-align:left}
  .mem-open:hover{text-decoration:underline}
  .mem-drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;justify-content:flex-end}
  .mem-sheet{background:var(--bg);border-left:1px solid var(--line);width:min(560px,94vw);
    height:100%;overflow-y:auto;padding:26px 26px 60px;position:relative}
  .mem-x{position:absolute;top:14px;right:16px;background:none;border:0;color:var(--muted);
    font-size:1.6rem;line-height:1;cursor:pointer}
  .mem-x:hover{color:var(--text)}
  .mem-sheet h3{font-family:var(--font-display);font-size:1.3rem;margin:0 0 2px;padding-right:30px}
  .mem-sub{color:var(--muted);font-size:.84rem;margin-bottom:18px}
  .mem-sheet h4{font-family:var(--font-display);font-size:.9rem;margin:22px 0 8px;
    display:flex;align-items:center;gap:8px}
  .mem-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:16px}
  .mem-fields dt{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
  .mem-fields dd{font-size:.88rem;margin:1px 0 0}
  .mem-tallies{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .mem-tallies span{background:var(--panel);border:1px solid var(--line);border-radius:99px;
    padding:5px 12px;font-size:.76rem;color:var(--muted)}
  .mem-list{display:grid;gap:4px}
  .mem-row{display:flex;gap:10px;align-items:baseline;background:var(--panel);
    border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:.82rem}
  .mem-row span{color:var(--muted);font-size:.76rem}
  .mem-when{margin-left:auto;white-space:nowrap}
  @media (max-width:560px){.mem-fields{grid-template-columns:1fr}.mem-sheet{padding:22px 16px 50px}}
  /* The kill switch reads as a state, not a button in a list — green rail when
     alerts are flowing, amber when they are muted, so the tab answers "am I
     still being emailed" before you read a word. */
  .al-switch{display:flex;gap:16px;align-items:center;justify-content:space-between;
    background:var(--panel);border:1px solid var(--line);border-left:3px solid #34d399;
    border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .al-switch.off{border-left-color:#f59e0b}
  .al-switch b{font-size:.9rem}
  .al-switch p{color:var(--muted);font-size:.8rem;margin:4px 0 0;max-width:62ch;line-height:1.5}
  .al-switch button{flex:none}
  .db-badge{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
  .db-badge.ghost{color:#eab308;border-color:rgba(234,179,8,.4)}
  .db-badge.claimed,.db-badge.account{color:#34d399;border-color:rgba(52,211,153,.4)}
  [hidden]{display:none!important}
  @media (max-width:900px){.ml-by{display:none}.mnav-right .auth-who{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}

  .up-field{display:block;margin-bottom:14px}
  .up-field>span{display:block;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim,var(--muted));margin-bottom:6px}
  .up-field > input,.up-field > select{width:100%;max-width:420px;background:var(--bg);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);
    font:inherit;font-size:.88rem;outline:0;box-sizing:border-box}
  .up-also{display:grid;grid-template-columns:1fr 30px;gap:8px;align-items:center;margin-bottom:7px;max-width:420px}
  .up-also input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;
    color:var(--text);font:inherit;font-size:.86rem;outline:0;min-width:0;box-sizing:border-box}
  .up-chk input[type=checkbox]{width:auto;flex:none;padding:0}
  .up-2col{display:grid;gap:0 12px;grid-template-columns:1fr 1fr;max-width:640px}
  .up-drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:30px 20px;
    text-align:center;color:var(--muted);cursor:pointer;transition:.2s;margin:6px 0 14px;font-size:.9rem}
  .up-drop:hover,.up-drop.over{border-color:var(--amber,var(--coral));color:var(--text)}
  .up-list{list-style:none;padding:0;margin:0 0 16px}
  .up-list li{display:flex;align-items:center;gap:12px;padding:9px 2px;
    border-bottom:1px solid var(--line);font-size:.86rem}
  .up-list b{flex:1}
  .up-list span{color:var(--muted);font-size:.8rem}
  .up-chk{display:flex;gap:9px;align-items:flex-start;margin:8px 0;cursor:pointer;font-size:.88rem}
  .up-chk input{margin-top:3px;accent-color:var(--amber,var(--coral))}
  .up-decl{border-left:3px solid var(--amber,var(--coral));background:var(--panel-2,rgba(0,0,0,.15));
    border-radius:0 10px 10px 0;padding:12px 14px;margin:14px 0;color:var(--muted);
    font-size:.82rem;line-height:1.55}
  .up-lane{margin:14px 0;padding:10px 14px;border-radius:10px;font-size:.84rem}
  .up-lane.instant{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.35);color:#8ee9c0}
  .up-lane.quote{background:var(--panel-2,rgba(0,0,0,.15));border:1px solid var(--line-2,var(--line));color:var(--muted)}
  .rv-pub{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;
    border-radius:99px;border:1px solid rgba(234,179,8,.4);color:#eab308}
  .rv-pub.live{border-color:rgba(52,211,153,.4);color:#34d399}
  @media (max-width:700px){.up-2col{grid-template-columns:1fr}}
  .rv-lane{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;
    border-radius:99px;border:1px solid var(--line)}
  .rv-lane.instant{color:#34d399;border-color:rgba(52,211,153,.4)}
  .rv-lane.quote{color:var(--muted)}
  .rv-editor{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .rv-fld{display:block;margin-bottom:14px}
  .rv-fld>span{display:block;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim,var(--muted));margin-bottom:6px}
  .rv-fld input,.rv-fld select,.rv-crow input,.rv-krow input,.rv-krow select{
    background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;
    color:var(--text);font:inherit;font-size:.86rem;outline:0;box-sizing:border-box;min-width:0}
  .rv-fld>input,.rv-fld>select{width:100%;max-width:420px}
  .rv-crow{display:grid;gap:8px;grid-template-columns:1.6fr 1.8fr 80px 30px;margin-bottom:8px;align-items:center}
  .rv-krow{display:grid;gap:8px;grid-template-columns:1.8fr 1fr 1.2fr 30px;margin-bottom:8px;align-items:center}
  .rv-x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.95rem}
  .rv-add{background:none;border:1px dashed var(--line);border-radius:9px;color:var(--muted);
    font:inherit;font-size:.78rem;padding:6px 13px;cursor:pointer}
  .rv-add:hover{color:var(--text)}
  .rv-hint{color:var(--dim,var(--muted));font-size:.76rem;line-height:1.5;margin-top:8px;max-width:66ch}
  .rv-chk{display:flex;gap:9px;align-items:center;margin-bottom:14px;font-size:.86rem;cursor:pointer}
  .rv-stat{font-size:.8rem;color:var(--muted);margin-left:10px}
  @media (max-width:700px){.rv-crow,.rv-krow{grid-template-columns:1fr 1fr 26px}}
  .cl-status{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;
    border-radius:99px;border:1px solid var(--line);white-space:nowrap}
  .cl-status.pending{color:#eab308;border-color:rgba(234,179,8,.4)}
  .cl-status.cleared{color:#34d399;border-color:rgba(52,211,153,.4)}
  .cl-status.rejected{color:#f87171;border-color:rgba(248,113,113,.4)}
  .cl-admin td{vertical-align:middle}
  .cl-a-val{color:var(--text);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cl-a-acts{display:flex;gap:6px;flex-wrap:wrap;padding-top:9px}
  .cl-a-acts .rv-btn{font-size:.72rem;padding:5px 11px}
  .pl-intro{margin-bottom:20px}
  .pl-intro h2{font-family:var(--font-display);font-size:1.35rem;margin-bottom:8px}
  .pl-intro p{color:var(--muted);max-width:70ch;font-size:.92rem;line-height:1.6}
  .pl-cols{display:grid;gap:18px;grid-template-columns:1fr 1fr;margin-bottom:18px}
  .pl-col h3,.db-card>h3{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim,var(--muted));margin-bottom:14px}
  .pl-list{list-style:none;padding:0;margin:0;counter-reset:none}
  .pl-step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .pl-step:last-child{border-bottom:0}
  .pl-n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
    background:var(--panel-2,rgba(255,255,255,.05));color:var(--muted);
    font-size:.7rem;font-variant-numeric:tabular-nums}
  .pl-step b{display:block;font-size:.9rem;margin-bottom:3px}
  .pl-step p{color:var(--muted);font-size:.84rem;line-height:1.55;margin:0}
  .pl-who{display:inline-block;margin-top:6px;font-size:.64rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim,var(--muted));border:1px solid var(--line);
    border-radius:99px;padding:2px 9px}
  .pl-note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    color:var(--muted);font-size:.82rem;line-height:1.55}
  .pl-tbl{width:100%;border-collapse:collapse;font-size:.86rem}
  .pl-tbl th{text-align:left;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim,var(--muted));font-weight:600;padding:0 12px 8px 0}
  .pl-tbl td{padding:9px 12px 9px 0;border-top:1px solid var(--line);color:var(--muted);vertical-align:top}
  .pl-tbl td:first-child{color:var(--text);white-space:nowrap}
  .pl-tbl code{font-size:.86em}
  .pl-flat{margin:0;padding-left:1.1em;color:var(--muted);font-size:.86rem;line-height:1.7}
  .pl-flat b{color:var(--text);font-weight:600}
  @media (max-width:900px){.pl-cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="mnav scrolled">
  <a href="index.html" style="font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);z-index:2">← Site</a>
  <a class="mlogo" href="index.html" aria-label="Snowstar"><img class="ml-img" src="assets/mutra-wordmark.png" alt="MUTRA"><span class="ml-by">dashboard</span></a>
  <div class="mnav-right" data-account-mount>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch theme" title="Switch theme">
      <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.4M12 19.2v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.4 12h2.4M19.2 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 14.3A8.5 8.5 0 1 1 9.7 3.5a6.8 6.8 0 0 0 10.8 10.8z"/>
      </svg>
    </button>
  </div>
</header>

<div class="db-wrap" id="app"><p class="db-empty">Loading…</p></div>

<script src="js/account.js?v=3"></script>
<script src="js/account-ui.js?v=15"></script>
<script src="js/dashboard.js?v=12"></script>
</body>
</html>
