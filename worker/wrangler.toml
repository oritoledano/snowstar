name = "snowstar-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false

# Runs on the site's own domain so the session cookie is first-party.
# Everything except /api/* falls through to GitHub Pages untouched.
routes = [
  { pattern = "snowstar.company/api/*", zone_name = "snowstar.company" },
  # Per-track share links. A scraper reads tags specific to the track here;
  # a person is redirected straight on to the catalogue with it open.
  { pattern = "snowstar.company/t/*", zone_name = "snowstar.company" }
]

# Workers AI: the search agent needs to understand a sentence, not match a
# word list. Everything else here stays deterministic — the model only turns
# a brief into catalogue facets, and the ranking is still ours.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "snowstar-members"
database_id = "88b958b0-2f50-4f45-a72f-2c46f45734a6"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "snowstar-mutra"

# The clean masters, deliberately in a bucket with NO custom domain and the
# r2.dev URL disabled — R2 public access is per-bucket, not per-prefix, and
# snowstar-mutra has to stay public because it also serves cover art and
# avatars. So the masters move out rather than the bucket going private.
[[r2_buckets]]
binding = "MASTERS"
bucket_name = "snowstar-masters"

# lets the Worker email the owner; only verified destinations are allowed
[[send_email]]
name = "EMAIL"
destination_address = "oritoledano@gmail.com"

[vars]
ALERT_TO = "oritoledano@gmail.com"
# The APEX snowstar.company is verified in Resend, so mail now comes FROM the
# bare domain — same address people already write to. Its bounce path lives at
# send.snowstar.company (Resend's Return-Path subdomain), which is why an MX
# and SPF sit there; the apex MX and SPF still belong to Cloudflare Email
# Routing and must not be touched, or inbound mail to hello@ stops.
MAIL_FROM = "SNOWSTAR.COMPANY <hello@snowstar.company>"

# daily digest at 07:00 UTC
[triggers]
crons = ["0 7 * * *"]

[observability]
enabled = true
