name = "snowstar-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false

# Runs on the site's own domain so the session cookie is first-party.
# Everything except /api/* falls through to GitHub Pages untouched.
routes = [
  { pattern = "snowstar.company/api/*", zone_name = "snowstar.company" }
]

[[d1_databases]]
binding = "DB"
database_name = "snowstar-members"
database_id = "88b958b0-2f50-4f45-a72f-2c46f45734a6"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "snowstar-mutra"

# The clean masters, deliberately in a bucket with NO custom domain and the
# r2.dev URL disabled — R2 public access is per-bucket, not per-prefix, and
# snowstar-mutra has to stay public because it also serves cover art and
# avatars. So the masters move out rather than the bucket going private.
[[r2_buckets]]
binding = "MASTERS"
bucket_name = "snowstar-masters"

# lets the Worker email the owner; only verified destinations are allowed
[[send_email]]
name = "EMAIL"
destination_address = "oritoledano@gmail.com"

[vars]
ALERT_TO = "oritoledano@gmail.com"
# send.snowstar.company verified in Resend on 23 Aug 2026 (DKIM + SPF + MX all
# confirmed resolving). mailLive() keys off the absence of "resend.dev" in this
# string, so changing it here is what switches on real delivery to members —
# and what makes the @send.snowstar.company senders in mail.js take effect.
MAIL_FROM = "SNOWSTAR.COMPANY <hello@send.snowstar.company>"

# daily digest at 07:00 UTC
[triggers]
crons = ["0 7 * * *"]

[observability]
enabled = true
