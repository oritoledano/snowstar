name = "snowstar-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false

# Runs on the site's own domain so the session cookie is first-party.
# Everything except /api/* falls through to GitHub Pages untouched.
routes = [
  { pattern = "snowstar.company/api/*", zone_name = "snowstar.company" }
]

[[d1_databases]]
binding = "DB"
database_name = "snowstar-members"
database_id = "88b958b0-2f50-4f45-a72f-2c46f45734a6"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "snowstar-mutra"

# lets the Worker email the owner; only verified destinations are allowed
[[send_email]]
name = "EMAIL"
destination_address = "oritoledano@gmail.com"

[vars]
ALERT_TO = "oritoledano@gmail.com"
# Resend sender. Until send.snowstar.company is verified in Resend, their shared
# onboarding address is the only one available — and it can ONLY deliver to the
# account owner. Swap this for "Snowstar <hello@send.snowstar.company>" the
# moment the domain verifies, or resets to real members will silently fail.
MAIL_FROM = "SNOWSTAR.COMPANY <onboarding@resend.dev>"

# daily digest at 07:00 UTC
[triggers]
crons = ["0 7 * * *"]

[observability]
enabled = true
