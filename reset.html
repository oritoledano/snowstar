<!DOCTYPE html>
<html lang="en" data-product="snowstar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Set a new password — Snowstar</title>
<link rel="icon" href="assets/ssc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/account.css?v=4">
<style>
  :root{
    --bg:#05070e; --panel:#0d1322; --line:rgba(151,183,255,.12);
    --text:#eef3fb; --muted:#93a0b8; --ice:#8fd8ff;
    --grad:linear-gradient(96deg,#6ee7b7 0%,#22d3ee 50%,#3b82f6 112%);
    --font-display:"Space Grotesk",system-ui,sans-serif;
    --font-body:"Inter",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);
    min-height:100vh;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  h1,h3{font-family:var(--font-display);letter-spacing:-.01em;line-height:1.15}
  .rs-wrap{width:min(420px,100%)}
  .rs-brand{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ice);
    text-align:center;margin-bottom:18px}
  .rs-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 30px 30px}
  .rs-card h1{font-size:1.5rem;margin-bottom:8px}
  .rs-sub{color:var(--muted);font-size:.9rem;margin-bottom:22px}
  .rs-note{color:var(--muted);font-size:.82rem;margin-top:16px;text-align:center}
  .rs-back{display:block;text-align:center;margin-top:20px;color:var(--muted);font-size:.85rem}
  .rs-back:hover{color:var(--text)}
</style>
</head>
<body>
<div class="rs-wrap">
  <div class="rs-brand">Snowstar.Company</div>
  <div class="rs-card" id="card">
    <h1>Checking your link…</h1>
    <p class="rs-sub">One moment.</p>
  </div>
  <a class="rs-back" href="/mutra.html">← Back to the catalog</a>
</div>

<script src="js/account.js?v=3"></script>
<script>
(function () {
  const card = document.getElementById('card');
  const token = new URLSearchParams(location.search).get('t') || '';

  const show = html => { card.innerHTML = html; };

  const dead = (title, msg) => show(
    `<h1>${title}</h1><p class="rs-sub">${msg}</p>
     <button class="auth-submit" id="again">Request a new link</button>`);

  /** Ask for a fresh link — same form the modal uses, minus the modal. */
  function askAgain() {
    show(`<h1>Reset your password</h1>
      <p class="rs-sub">We'll email you a new link. It works once and lasts 45 minutes.</p>
      <form id="reqForm" novalidate>
        <label class="auth-field"><span>Email</span>
          <input type="email" name="email" autocomplete="email" required></label>
        <p class="auth-error" role="alert" hidden></p>
        <button type="submit" class="auth-submit">Send the link</button>
      </form>`);
    const form = document.getElementById('reqForm');
    const err = card.querySelector('.auth-error');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = form.querySelector('.auth-submit');
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        await SnowstarAccount.requestReset(form.email.value.trim());
        // deliberately the same answer whether or not that address has an account
        show(`<h1>Check your email</h1>
          <p class="rs-sub">If that address has a Snowstar account, a reset link is on its way.
          It works once and expires in 45 minutes.</p>
          <p class="rs-note">Nothing after a minute or two? Check your spam folder.</p>`);
      } catch (e2) {
        err.textContent = e2.code === 'rate_limited'
          ? 'Too many requests. Please wait a few minutes.'
          : 'Couldn’t send that right now. Please try again.';
        err.hidden = false;
        btn.disabled = false; btn.textContent = 'Send the link';
      }
    });
    setTimeout(() => form.email.focus(), 50);
  }

  card.addEventListener('click', e => { if (e.target.id === 'again') askAgain(); });

  function setForm() {
    show(`<h1>Set a new password</h1>
      <p class="rs-sub">Pick something at least 8 characters long. This signs you out everywhere else.</p>
      <form id="pwForm" novalidate>
        <label class="auth-field"><span>New password</span>
          <input type="password" name="password" autocomplete="new-password" required minlength="8"></label>
        <label class="auth-field"><span>Confirm password</span>
          <input type="password" name="confirm" autocomplete="new-password" required minlength="8"></label>
        <p class="auth-error" role="alert" hidden></p>
        <button type="submit" class="auth-submit">Save new password</button>
      </form>`);
    const form = document.getElementById('pwForm');
    const err = card.querySelector('.auth-error');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      err.hidden = true;
      const pw = form.password.value, confirm = form.confirm.value;
      if (pw.length < 8) { err.textContent = 'Use at least 8 characters.'; err.hidden = false; return; }
      if (pw !== confirm) { err.textContent = 'Those two don’t match.'; err.hidden = false; return; }
      const btn = form.querySelector('.auth-submit');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await SnowstarAccount.confirmReset(token, pw);
        show(`<h1>Password changed</h1>
          <p class="rs-sub">You're signed in on this device. Everywhere else has been signed out.</p>
          <a class="auth-submit" style="text-decoration:none" href="/mutra.html">Go to the catalog</a>`);
      } catch (e2) {
        if (e2.code === 'invalid_token') {
          dead('That link has expired', 'Reset links work once and last 45 minutes.');
          return;
        }
        err.textContent = e2.code === 'rate_limited'
          ? 'Too many attempts. Please wait a few minutes.'
          : 'Couldn’t save that. Please try again.';
        err.hidden = false;
        btn.disabled = false; btn.textContent = 'Save new password';
      }
    });
    setTimeout(() => form.password.focus(), 50);
  }

  // no token in the URL means someone came here directly — offer the request form
  if (!token) { askAgain(); return; }

  fetch('/api/reset/check?t=' + encodeURIComponent(token))
    .then(r => r.json())
    .then(d => d.valid ? setForm() : dead('That link has expired', 'Reset links work once and last 45 minutes.'))
    .catch(() => dead('Couldn’t check that link', 'Please request a new one.'));
})();
</script>
</body>
</html>
