<!DOCTYPE html>
<html lang="en" data-product="mutra">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mutra — Submissions review</title>
<link rel="icon" href="assets/ssc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="js/mutra-skin.js?v=3"></script>
<link rel="stylesheet" href="css/skins.css?v=3">
<link rel="stylesheet" href="css/account.css?v=4">
<link rel="stylesheet" href="css/mutra.css?v=50">
<style>
  .rv-wrap{max-width:900px;margin:0 auto;padding:100px clamp(18px,4vw,44px) 60px}
  .rv-head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:20px}
  .rv-head h1{font-family:var(--font-display);font-size:clamp(1.7rem,3.4vw,2.4rem)}
  .rv-tabs{display:flex;gap:8px}
  .rv-tab{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;
    padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:none}
  .rv-tab.active{color:var(--bg,#04121d);background:var(--grad);border-color:transparent}
  .rv-item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
  .rv-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .rv-top b{font-size:1.02rem}
  .rv-top .who{color:var(--amber,#8fd8ff);font-size:.86rem}
  .rv-top .meta{color:var(--muted);font-size:.78rem;margin-left:auto}
  .rv-note{color:var(--muted);font-size:.84rem;margin:6px 0 10px}
  .rv-item audio{width:100%;margin:8px 0 12px}
  .rv-acts{display:flex;gap:8px;flex-wrap:wrap}
  .rv-btn{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
    padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text)}
  .rv-ok{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4)}
  .rv-no{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.35)}
  .rv-empty{color:var(--muted);padding:26px 6px}
  .rv-decl{background:var(--panel-2,rgba(0,0,0,.14));border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.8rem;color:var(--muted)}
  .rv-decl b{color:var(--text)}
  .rv-acum{color:#eab308;font-weight:600}
  .rv-mail{margin-top:34px}
  .rv-mail h2{font-family:var(--font-display);font-size:1.3rem;margin-bottom:6px}
  .rv-mail .sub{color:var(--muted);font-size:.84rem;margin-bottom:14px}
  .rv-mrow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:.86rem}
  .rv-mrow summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}
  .rv-mrow pre{white-space:pre-wrap;color:var(--muted);font:inherit;font-size:.8rem;margin:10px 0;border-top:1px solid var(--line);padding-top:10px}
  .rv-sent{color:#34d399;font-size:.74rem}
  .rv-err{color:#f87171;font-size:.74rem}
  .rv-gate{max-width:420px;margin:130px auto;text-align:center}
  .rv-hint{color:var(--dim,var(--muted));font-size:.8rem;margin:18px 0 0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header class="mnav scrolled">
  <a href="mutra.html" style="font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);z-index:2">← Catalog</a>
  <a class="mlogo" href="mutra.html" aria-label="Mutra"><img class="ml-img" src="assets/mutra-wordmark.png" alt="MUTRA"><span class="ml-by">review</span></a>
</header>

<div class="rv-wrap" id="app"><p class="rv-empty">Loading…</p></div>

<script src="js/account.js?v=3"></script>
<script>
(function () {
  const app = document.getElementById('app');
  let tab = 'pending';
  const fmt = (ts) => new Date(ts * 1000).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const esc = (s) => String(s || '').replace(/</g, '&lt;');

  async function load() {
    const res = await fetch('/api/submissions?status=' + tab, { credentials: 'same-origin' });
    if (res.status === 403) {
      app.innerHTML = `<div class="rv-gate"><h1>Submissions</h1>
        <p style="color:var(--muted);margin:14px 0 22px">This page is for the site owner. Sign in with the owner account on the catalog page.</p>
        <a class="mbtn mbtn-solid" href="mutra.html">Back to the catalog</a></div>`;
      return;
    }
    const d = await res.json();
    const mail = await fetch('/api/mailbox', { credentials: 'same-origin' }).then((r) => r.json()).catch(() => ({ outbox: [] }));
    render(d.submissions || [], mail);
  }

  function declBlock(s) {
    if (!s.decl_kind) return '';
    let splits = [];
    try { splits = JSON.parse(s.splits_snapshot || '[]'); } catch {}
    const kindWord = { solo: 'Owns 100%', shared: 'Shared ownership', behalf: 'Uploaded by you on behalf' }[s.decl_kind] || s.decl_kind;
    return `<div class="rv-decl">
      <b>${kindWord}</b> — signed “${esc(s.signed_name)}”
      ${s.acum ? ' · <span class="rv-acum">⚠ ACUM/royalty-society registered</span>' : ''}
      ${splits.length ? '<br>Splits: ' + splits.map((c) =>
        `${esc(c.name)} (${esc(c.email)}) ${(c.share_bp / 100).toFixed(c.share_bp % 100 ? 2 : 0)}%`).join(' · ') : ''}
      ${s.decl_kind === 'behalf' ? '<br>Evidence: ' + (s.evidence_kind ? esc(s.evidence_kind) + (s.evidence_note ? ' — ' + esc(s.evidence_note) : '') : '<i>none on file — get a “reply YES” from the artist</i>') : ''}
    </div>`;
  }

  function mailSection(mail) {
    const pending = (mail.outbox || []).filter((m) => !m.sent_at);
    const sent = (mail.outbox || []).filter((m) => m.sent_at).slice(0, 10);
    return `<div class="rv-mail">
      <h2>Collaborator notifications</h2>
      <p class="sub">Nothing is emailed without you. ${mail.mail_live
        ? 'Sending goes straight to the collaborator.'
        : 'Until the send domain is verified, “Send” delivers the email to YOUR inbox with a forward-to banner — you forward it yourself.'}</p>
      ${pending.length ? pending.map((m) => `
        <details class="rv-mrow" data-id="${m.id}">
          <summary><b>${esc(m.to_name || m.to_email)}</b>
            <span style="color:var(--muted)">${esc(m.to_email)}${m.title ? ' · re “' + esc(m.title) + '”' : ''}</span>
            ${m.last_error ? `<span class="rv-err">last try failed: ${esc(m.last_error)}</span>` : ''}
            <button class="rv-btn rv-ok rv-send" style="margin-left:auto">Approve &amp; send</button></summary>
          <pre>${esc(m.body)}</pre>
        </details>`).join('')
      : '<p class="rv-empty">No notifications waiting.</p>'}
      ${sent.length ? '<p class="sub" style="margin-top:14px">Recently sent:</p>' + sent.map((m) => `
        <div class="rv-mrow"><b>${esc(m.to_email)}</b>
          ${m.sent_at ? `<span class="rv-sent">${m.sent_how === 'direct' ? 'sent' : 'delivered to you for forwarding'} · ${fmt(m.sent_at)}</span>`
            : `<span class="rv-err">failed: ${esc(m.last_error)}</span>`}
        </div>`).join('') : ''}
    </div>`;
  }

  function render(items, mail) {
    app.innerHTML = `
      <div class="rv-head">
        <h1>Submissions</h1>
        <div class="rv-tabs">
          ${['pending', 'approved', 'rejected'].map((t) =>
            `<button class="rv-tab ${t === tab ? 'active' : ''}" data-t="${t}">${t}</button>`).join('')}
        </div>
      </div>
      ${items.length ? items.map((s) => `
        <div class="rv-item" data-id="${s.id}">
          <div class="rv-top">
            <b>${esc(s.title)}</b>
            <span class="who">${esc(s.artist_name || s.email)}</span>
            <span class="meta">${(s.size / 1048576).toFixed(1)}MB · ${s.ext} · ${fmt(s.created_at)}</span>
          </div>
          ${declBlock(s)}
          ${s.artist_note ? `<p class="rv-note">Artist: “${esc(s.artist_note)}”</p>` : ''}
          ${s.review_note ? `<p class="rv-note">You: “${esc(s.review_note)}”</p>` : ''}
          <audio controls preload="none" src="/api/artist/file?id=${s.id}"></audio>
          <div class="rv-acts">
            ${tab !== 'approved' ? '<button class="rv-btn rv-ok" data-a="approved">Approve</button>' : ''}
            ${tab !== 'rejected' ? '<button class="rv-btn rv-no" data-a="rejected">Reject</button>' : ''}
            ${tab !== 'pending' ? '<button class="rv-btn" data-a="pending">Back to pending</button>' : ''}
          </div>
        </div>`).join('')
      : `<p class="rv-empty">${tab === 'pending' ? 'Nothing waiting — inbox zero.' : 'Nothing here yet.'}</p>`}
      ${mailSection(mail || { outbox: [] })}
      <p class="rv-hint">Approving queues a track for catalog ingestion (analysis, waveform, artwork) —
      ask Claude to “process approved uploads” to take them live. The artist sees your note either way.</p>`;

    app.querySelectorAll('.rv-send').forEach((b) =>
      b.addEventListener('click', async (e) => {
        e.preventDefault();
        b.disabled = true; b.textContent = 'Sending…';
        await fetch('/api/mailbox/send', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ ids: [Number(b.closest('.rv-mrow').dataset.id)] }),
        });
        load();
      }));

    app.querySelectorAll('.rv-tab').forEach((b) =>
      b.addEventListener('click', () => { tab = b.dataset.t; load(); }));
    app.querySelectorAll('.rv-item .rv-btn').forEach((b) =>
      b.addEventListener('click', async () => {
        const id = Number(b.closest('.rv-item').dataset.id);
        const status = b.dataset.a;
        const note = status === 'pending' ? '' :
          (prompt(status === 'approved' ? 'Note to the artist (optional):' : 'Tell them why (they will see this):') || '');
        await fetch('/api/submissions/review', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ id, status, note }),
        });
        load();
      }));
  }

  (function boot(n) {
    if (window.SnowstarAccount && SnowstarAccount.ready) return load();
    if (n > 40) return load();
    setTimeout(() => boot(n + 1), 100);
  })(0);
})();
</script>
</body>
</html>
